
<div class="min-h-screen pt-15 m-5">

    <div class="w-full flex flex-col justify-center items-center">

        @if (status == 'error') {
            <div class="bg-red-500 text-white opacity-55 
                        mb-5 rounded p-4 shadow-sm shadow-red-300">Error al identificarte</div>
        }

        <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm" class="w-full md:w-1/3 space-y-4 border p-8 rounded border-gray-300 shadow-lg shadow-gray-400" >

            <h1 class="text-4xl mb-10 text-center"> {{title}} </h1>

            <div class="flex flex-col md:flex-row gap-2 md:items-center">

                <label for="email" class="md:w-17 font-semibold text-gray-700">Email</label>

                <div class="flex flex-col flex-1">
                    <input class="ms-2 p-2 rounded
                                border-2
                                border-gray-300
                                focus:border-orange-300
                                focus:ring-2
                                focus:ring-orange-200
                                transition duration-400
                                outline-none" type="email" name="email" #email="ngModel" [(ngModel)]="user.email" email required/>
                    
                    @if(!email.valid && email.touched){

                        <span class="font-semibold text-center text-red-500">El email es obligatorio</span>

                    }
                </div>
                
                

            </div>

            <div class="flex flex-col md:flex-row gap-2 md:items-center">

                <label for="password" class="md:w-17 font-semibold text-gray-700">Password</label>

                <div class="flex flex-col flex-1">

                    <input class="ms-2 p-2 rounded
                            border-2
                            border-gray-300
                            focus:border-orange-300
                            focus:ring-2
                            transition duration-400
                            focus:ring-orange-200
                            outline-none" type="password" name="password" #password="ngModel" [(ngModel)]="user.password" required/>
                    
                    @if(!password.valid && password.touched){

                        <span class="font-semibold text-center text-red-500">La contraseña es obligatoria</span>

                    }

                </div>
                

            </div>
            
            <button
                type="submit"
                
                class="w-full bg-blue-600 text-white py-2 hover:bg-blue-700 transition cursor-pointer shadow-xl mt-5"
            >
                Entrar
            </button>
                
        </form>
 
    </div>
</div>
